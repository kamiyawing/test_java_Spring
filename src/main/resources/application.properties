spring.application.name=java_spring_test

server.servlet.context-path=/cytech
server.port=7777
spring.thymeleaf.cache=false

spring.datasource.url=jdbc:mysql://localhost:3306/java_test?useSSL=false&serverTimezone=Asia/Tokyo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#都度ログイン面倒なため開発用設定！実装時は必ず消すこと！標準のセッションアウトは30分！
server.servlet.session.timeout=60m